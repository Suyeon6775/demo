<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Paradox of Translation</title>
    <link rel="stylesheet" href="mobile.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <!-- 메인 메뉴 -->
    <div class="screen" id="screen-menu">
      <div class="menu-header">
        <img src="./mobile-title.svg" class="menu-logo-img" />
        <div class="menu-sub">이미지와 언어 사이의 필연적 손실과 변질</div>
      </div>
      <div class="menu-items">
        <div class="menu-item primary" id="btn-scan">
          <div class="menu-item-left">
            <span class="menu-item-num">01</span>
            <span class="menu-item-name">읽기</span>
            <span class="menu-item-desc">이미지를 스캔합니다</span>
          </div>
          <span class="menu-arrow">→</span>
        </div>
        <div class="menu-item" id="btn-archive">
          <div class="menu-item-left">
            <span class="menu-item-num">02</span>
            <span class="menu-item-name">아카이브</span>
            <span class="menu-item-desc">모든 스캔 결과를 봅니다</span>
          </div>
          <span class="menu-arrow">→</span>
        </div>
      </div>
    </div>

    <!-- 읽기 -->
    <div class="screen hidden" id="screen-scan">
      <div class="screen-header">
        <button class="back-btn" onclick="goMenu()">← 메뉴</button>
        <span class="screen-title">읽기</span>
        <div style="width: 48px"></div>
      </div>
      <div class="camera-wrap">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="camera-overlay camera-corners"></div>
      </div>
      <div class="capture-btn-wrap">
        <button class="capture-btn" id="capture-btn">스캔</button>
      </div>
      <canvas id="capture-canvas"></canvas>
    </div>

    <!-- 아카이브 목록 -->
    <div class="screen hidden" id="screen-archive">
      <div class="screen-header">
        <button class="back-btn" onclick="exitArchive()">← 메뉴</button>
        <span class="screen-title">아카이브</span>
        <span
          style="font-size: 10px; color: #888; letter-spacing: 0.1em"
          id="archive-mobile-count"
        ></span>
      </div>
      <div class="archive-grid" id="archive-mobile-grid"></div>
    </div>

    <!-- 아카이브 상세 -->
    <div class="screen hidden" id="screen-archive-detail">
      <div class="screen-header">
        <button class="back-btn" onclick="showScreen('screen-archive')">
          ← 목록
        </button>
        <span class="screen-title">상세보기</span>
        <div style="width: 48px"></div>
      </div>
      <div
        style="
          flex: 1;
          overflow-y: auto;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 24px;
        "
        id="archive-detail-content"
      ></div>
    </div>

    <!-- 처리 중 오버레이 -->
    <div id="overlay-processing" class="hidden">
      <div class="processing-dots">
        <div class="processing-dot"></div>
        <div class="processing-dot"></div>
        <div class="processing-dot"></div>
      </div>
      <span class="processing-text" id="processing-text">처리 중</span>
    </div>

    <script>
      const socket = io({ query: { type: 'mobile' } });
      let currentState = null;
      let webcamStream = null;
      let cachedScans = [];

      socket.on('state', (state) => {
        currentState = state;
        cachedScans = state.scans || [];

        if (state.mode === 'scanning') {
          showProcessing('번역 중');
        } else {
          hideProcessing();
        }
      });

      function showScreen(id) {
        document
          .querySelectorAll('.screen')
          .forEach((s) => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
      }

      function goMenu() {
        showScreen('screen-menu');
        stopWebcam();
      }

      // 읽기
      document.getElementById('btn-scan').onclick = async () => {
        showScreen('screen-scan');
        await startWebcam();
      };

      async function startWebcam() {
        try {
          webcamStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 960 },
            },
          });
          document.getElementById('webcam').srcObject = webcamStream;
        } catch (e) {
          try {
            webcamStream = await navigator.mediaDevices.getUserMedia({
              video: true,
            });
            document.getElementById('webcam').srcObject = webcamStream;
          } catch (e2) {
            alert(
              '카메라 접근이 거부되었습니다. 사파리 설정에서 카메라를 허용해주세요.',
            );
          }
        }
      }

      function stopWebcam() {
        if (webcamStream) {
          webcamStream.getTracks().forEach((t) => t.stop());
          webcamStream = null;
        }
      }

      document.getElementById('capture-btn').onclick = () => {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('capture-canvas');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 960;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const originalDataUrl = canvas.toDataURL('image/jpeg', 0.85);
        const base64 = originalDataUrl.split(',')[1];
        showProcessing('읽는 중');
        socket.emit('scan', { base64, originalDataUrl });
        stopWebcam();
        goMenu();
      };

      // 아카이브
      document.getElementById('btn-archive').onclick = () => {
        socket.emit('showArchive');
        const scans = currentState?.scans || cachedScans || [];
        renderArchiveMobile(scans);
        showScreen('screen-archive');
      };

      function renderArchiveMobile(scans) {
        const grid = document.getElementById('archive-mobile-grid');
        const count = document.getElementById('archive-mobile-count');
        count.textContent = scans.length + '개';
        grid.innerHTML = '';
        scans.forEach((scan) => {
          const item = document.createElement('div');
          item.style.cssText =
            'background:#fff;aspect-ratio:1;overflow:hidden;cursor:pointer;';
          item.onclick = () => showArchiveDetail(scan);
          const img = document.createElement('img');
          img.src = scan.originalDataUrl || scan.imageA || '';
          img.style.cssText =
            'width:100%;height:100%;object-fit:cover;display:block;';
          item.appendChild(img);
          grid.appendChild(item);
        });
      }

      function showArchiveDetail(scan) {
        const chain = scan.depthChain?.[0] || scan;
        const content = document.getElementById('archive-detail-content');
        content.innerHTML = `
          <div>
            <div style="font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:#888;margin-bottom:8px;">원본</div>
            <img src="${scan.originalDataUrl || ''}" style="width:100%;display:block;">
          </div>
          <div>
            <div style="font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:#888;margin-bottom:8px;">LITERAL</div>
            <p style="font-family:'Space Mono',monospace;font-size:12px;line-height:1.7;margin-bottom:12px;">${chain.textA || scan.textA || ''}</p>
            <img src="${chain.imageA || scan.imageA || ''}" style="width:100%;display:block;">
          </div>
          <div>
            <div style="font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:#888;margin-bottom:8px;">POETIC</div>
            <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:14px;line-height:1.7;margin-bottom:12px;">${chain.textB || scan.textB || ''}</p>
            <img src="${chain.imageB || scan.imageB || ''}" style="width:100%;display:block;">
          </div>
        `;
        showScreen('screen-archive-detail');
      }

      function exitArchive() {
        socket.emit('exitArchive');
        showScreen('screen-menu');
      }

      // 처리 중
      function showProcessing(text) {
        document.getElementById('processing-text').textContent = text;
        document
          .getElementById('overlay-processing')
          .classList.remove('hidden');
      }

      function hideProcessing() {
        document.getElementById('overlay-processing').classList.add('hidden');
      }
    </script>
  </body>
</html>
