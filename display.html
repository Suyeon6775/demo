<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALT — Display</title>
    <link rel="stylesheet" href="display.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <!-- IDLE -->
    <div id="screen-idle">
      <div class="idle-title">Paradox of Translation</div>
      <div class="idle-archive" id="idle-archive"></div>
    </div>

    <!-- SCANNING -->
    <div id="screen-scanning" class="hidden">
      <!-- <span class="scan-label">읽는 중</span> -->
      <canvas id="scan-canvas"></canvas>
    </div>

    <!-- ORIGINAL REVEAL -->
    <div id="original-reveal" class="hidden">
      <span class="reveal-label">원본</span>
      <img id="original-img" src="" alt="원본" />
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="hidden">
      <div class="panel panel-a">
        <div class="panel-label">LITERAL</div>
        <p class="panel-text" id="text-a"></p>
        <div class="panel-img-wrap">
          <img id="img-a" src="" alt="" />
          <div class="loss-overlay" id="loss-a"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="panel panel-b">
        <div class="panel-label">POETIC</div>
        <p class="panel-text" id="text-b"></p>
        <div class="panel-img-wrap">
          <img id="img-b" src="" alt="" />
          <div class="loss-overlay" id="loss-b"></div>
        </div>
      </div>
    </div>

    <!-- 깊이 인디케이터 -->
    <div class="depth-indicator hidden" id="depth-indicator"></div>

    <!-- 아카이브 화면 -->
    <div id="screen-archive" class="hidden">
      <div class="archive-header">
        <span class="archive-title">Archive</span>
        <span class="archive-count" id="archive-count"></span>
      </div>
      <div class="archive-grid" id="archive-grid"></div>
      <div class="archive-detail hidden" id="archive-detail">
        <div class="detail-panels">
          <div class="detail-panel">
            <div class="detail-label">원본</div>
            <img class="detail-img" id="detail-original" src="" alt="" />
          </div>
          <div class="detail-panel">
            <div class="detail-label">LITERAL</div>
            <p class="detail-text" id="detail-text-a"></p>
            <img class="detail-img" id="detail-img-a" src="" alt="" />
          </div>
          <div class="detail-panel">
            <div class="detail-label">POETIC</div>
            <p class="detail-text detail-text-poetic" id="detail-text-b"></p>
            <img class="detail-img" id="detail-img-b" src="" alt="" />
          </div>
        </div>
      </div>
    </div>

    <script>
      const socket = io({ query: { type: 'display' } });

      const screens = {
        idle: document.getElementById('screen-idle'),
        scanning: document.getElementById('screen-scanning'),
        reveal: document.getElementById('original-reveal'),
        result: document.getElementById('screen-result'),
        archive: document.getElementById('screen-archive'),
      };

      function showOnly(name) {
        Object.entries(screens).forEach(([k, el]) => {
          el.classList.toggle('hidden', k !== name);
        });
      }

      let revealTimer = null;
      let lastSpokenScanId = null;

      socket.on('state', (state) => {
        if (revealTimer) {
          clearTimeout(revealTimer);
          revealTimer = null;
        }

        if (state.mode === 'archive') {
          showOnly('archive');
          renderArchiveGrid(state.scans);
          document.getElementById('depth-indicator').classList.add('hidden');
          return;
        }

        if (state.mode === 'idle') {
          showOnly('idle');
          updateArchive(state.scans);
          window._currentScans = state.scans;
          document.getElementById('depth-indicator').classList.add('hidden');
        } else if (state.mode === 'scanning') {
          if (state.currentScan?.originalDataUrl && state.depthLevel === 0) {
            document.getElementById('original-img').src =
              state.currentScan.originalDataUrl;
            showOnly('reveal');
            revealTimer = setTimeout(() => {
              showOnly('scanning');
              startScanAnim();
            }, 3000);
          } else {
            showOnly('scanning');
            startScanAnim();
          }
        } else if (state.mode === 'result') {
          const scan = state.currentScan;
          if (!scan) return;

          const chain = scan.depthChain;
          const current = chain[state.depthLevel] || chain[chain.length - 1];

          document.getElementById('text-a').textContent = current.textA;
          document.getElementById('text-b').textContent = current.textB;
          if (current.imageA)
            document.getElementById('img-a').src = current.imageA;
          if (current.imageB)
            document.getElementById('img-b').src = current.imageB;

          const resultEl = document.getElementById('screen-result');
          resultEl.className = '';
          if (state.viewMode === 'literal')
            resultEl.classList.add('view-literal');
          if (state.viewMode === 'poetic')
            resultEl.classList.add('view-poetic');

          const lossOpacity = state.lossLevel / 100;
          document.getElementById('loss-a').style.opacity = lossOpacity;
          document.getElementById('loss-b').style.opacity = lossOpacity;

          showOnly('result');
          stopScanAnim();
          window._currentScans = state.scans;

          // 스크린리더 — 새 스캔일 때만 읽기
          if (scan.id !== lastSpokenScanId) {
            lastSpokenScanId = scan.id;
            speak(current.textA, current.textB);
          }
        }
      });

      // 스크린리더
      const synth = window.speechSynthesis;
      let speechUnlocked = false;

      document.addEventListener('click', () => {
        if (!speechUnlocked) {
          const u = new SpeechSynthesisUtterance('');
          synth.speak(u);
          speechUnlocked = true;
        }
      });

      function speak(textA, textB) {
        synth.cancel();

        const uttA = new SpeechSynthesisUtterance(textA);
        uttA.lang = 'ko-KR';
        uttA.rate = 0.9;
        uttA.pitch = 0.8;

        const uttB = new SpeechSynthesisUtterance(textB);
        uttB.lang = 'ko-KR';
        uttB.rate = 0.75;
        uttB.pitch = 0.7;

        uttA.onend = () => {
          setTimeout(() => synth.speak(uttB), 800);
        };

        synth.speak(uttA);
      }

      // ── 로딩 이미지 나열 애니메이션 ────────────────────────
      let stackInterval = null;
      let savedImageUrls = [];

      async function loadSavedImages() {
        try {
          const res = await fetch('/api/saved-images');
          savedImageUrls = await res.json();
        } catch (e) {
          savedImageUrls = [];
        }
      }
      loadSavedImages();

      function startScanAnim() {
        const scanning = document.getElementById('screen-scanning');
        const oldEl = document.getElementById('stack-container');
        if (oldEl) oldEl.remove();

        const cols = 6;
        const cellSize = Math.ceil(window.innerWidth / cols);
        const rows = Math.ceil(window.innerHeight / cellSize) + 1;
        const total = cols * rows;

        const container = document.createElement('div');
        container.id = 'stack-container';
        container.style.position = 'absolute';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = (cols * cellSize) + 'px';
        container.style.height = (rows * cellSize) + 'px';
        container.style.display = 'grid';
        container.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cellSize + 'px)';
        container.style.gridTemplateRows = 'repeat(' + rows + ', ' + cellSize + 'px)';
        container.style.pointerEvents = 'none';
        scanning.appendChild(container);

        const newScans = (window._currentScans || [])
          .map(function(s) { return s.originalDataUrl || s.imageA; })
          .filter(Boolean);
        const shuffled = savedImageUrls.slice().sort(function() { return Math.random() - 0.5; });
        const allImages = newScans.concat(shuffled).slice(0, total);

        let idx = 0;
        function addNext() {
          if (idx >= allImages.length) {
            clearInterval(stackInterval);
            stackInterval = null;
            return;
          }
          const src = allImages[idx++];
          const img = document.createElement('img');
          img.src = src;
          img.style.width = cellSize + 'px';
          img.style.height = cellSize + 'px';
          img.style.objectFit = 'cover';
          img.style.display = 'block';
          img.style.opacity = '0';
          img.style.transform = 'scale(0.85)';
          img.style.transition = 'opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1)';
          container.appendChild(img);
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              img.style.opacity = '1';
              img.style.transform = 'scale(1)';
            });
          });
        }

        addNext();
        stackInterval = setInterval(addNext, 250);
      }

      function stopScanAnim() {
        if (stackInterval) {
          clearInterval(stackInterval);
          stackInterval = null;
        }
        const old = document.getElementById('stack-container');
        if (old) old.remove();
      }

      // textReady는 이제 사용 안 함 (애니메이션 변경)
      socket.on('textReady', () => {});

      // 아카이브 그리드
      function renderArchiveGrid(scans) {
        const grid = document.getElementById('archive-grid');
        const count = document.getElementById('archive-count');
        count.textContent = scans.length + '개';
        grid.innerHTML = '';
        document.getElementById('archive-detail').classList.add('hidden');
        scans.forEach((scan) => {
          const item = document.createElement('div');
          item.className = 'archive-grid-item';
          item.onclick = () => showDetail(scan);
          const img = document.createElement('img');
          img.src = scan.originalDataUrl || scan.imageA || '';
          img.alt = '';
          item.appendChild(img);
          grid.appendChild(item);
        });
      }

      function showDetail(scan) {
        const chain = scan.depthChain?.[0] || scan;
        document.getElementById('detail-original').src =
          scan.originalDataUrl || '';
        document.getElementById('detail-text-a').textContent =
          chain.textA || scan.textA || '';
        document.getElementById('detail-text-b').textContent =
          chain.textB || scan.textB || '';
        document.getElementById('detail-img-a').src =
          chain.imageA || scan.imageA || '';
        document.getElementById('detail-img-b').src =
          chain.imageB || scan.imageB || '';
        document.getElementById('archive-detail').classList.remove('hidden');
      }

      socket.on('selectArchive', (index) => {
        const grid = document.getElementById('archive-grid');
        const items = grid.querySelectorAll('.archive-grid-item');
        if (items[index]) items[index].click();
      });

      function updateArchive(scans) {
        const el = document.getElementById('idle-archive');
        el.innerHTML = '';
        scans.slice(0, 20).forEach((s) => {
          if (s.imageB) {
            const img = document.createElement('img');
            img.className = 'archive-thumb';
            img.src = s.imageB;
            el.appendChild(img);
          }
        });
      }

      function updateArchiveStrip(scans) {
        const el = document.getElementById('archive-strip');
        el.innerHTML = '';
        scans.slice(0, 30).forEach((s) => {
          if (s.imageA) {
            const img = document.createElement('img');
            img.className = 'strip-item';
            img.src = s.imageA;
            el.appendChild(img);
          }
        });
      }
    </script>
  </body>
</html>
