<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paradox of Translation</title>
    <link rel="stylesheet" href="display.css" />
    <link rel="stylesheet" href="landing.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <!-- IDLE: 랜딩 페이지 -->
    <div id="screen-idle">
      <div id="grid"></div>

      <div id="overlay">
        <img src="Paradox-of-Translation.svg" class="title-img" />
        <div class="subtitle">
          Exploring the Gap Between <br />Alt&#8209;Text and Media
        </div>
      </div>

      <div class="float-text top-right">
        이미지는 언어로 번역되며 소실되고,<br />
        언어는 이미지로 복원되며 변형된다.
      </div>
      <div class="float-text bottom-left-1">
        대체 텍스트 기반 매체 간 간극 탐구
      </div>
      <div class="float-text bottom-left-2">
        이미지와 언어 사이의 필연적 손실과 변질
      </div>
    </div>

    <!-- SCANNING -->
    <div id="screen-scanning" class="hidden">
      <canvas id="scan-canvas"></canvas>
    </div>

    <!-- ORIGINAL REVEAL -->
    <div id="original-reveal" class="hidden">
      <span class="reveal-label">원본</span>
      <img id="original-img" src="" alt="원본" />
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="hidden">
      <!-- 상단 헤더 -->
      <div class="result-header">
        <img
          src="./Paradox-of-Translation.svg"
          class="result-title-img"
          alt="Paradox of Translation"
        />
        <!-- <span class="result-scan-num" id="result-scan-num"></span> -->
      </div>

      <!-- 3패널 -->
      <div class="result-panels">
        <div class="panel panel-a">
          <div class="panel-label">LITERAL</div>
          <p class="panel-text" id="text-a"></p>
          <div class="panel-img-wrap">
            <img id="img-a" src="" alt="" />
            <div class="loss-overlay" id="loss-a"></div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="panel panel-original">
          <div class="panel-label">Original</div>
          <div class="original-img-wrap">
            <img id="original-scan-img" src="" alt="" />
          </div>
        </div>

        <div class="divider"></div>

        <div class="panel panel-b">
          <div class="panel-label">POETIC</div>
          <p class="panel-text" id="text-b"></p>
          <div class="panel-img-wrap">
            <img id="img-b" src="" alt="" />
            <div class="loss-overlay" id="loss-b"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 깊이 인디케이터 -->
    <div class="depth-indicator hidden" id="depth-indicator"></div>

    <!-- 아카이브 화면 -->
    <div id="screen-archive" class="hidden">
      <div class="archive-header">
        <img src="./Archive.svg" class="archive-title-img" />
        <span class="archive-count" id="archive-count"></span>
      </div>
      <div class="archive-grid" id="archive-grid"></div>
      <div class="archive-detail hidden" id="archive-detail">
        <div class="detail-panels">
          <div class="detail-panel">
            <div class="detail-label">원본</div>
            <img class="detail-img" id="detail-original" src="" alt="" />
          </div>
          <div class="detail-panel">
            <div class="detail-label">LITERAL</div>
            <p class="detail-text" id="detail-text-a"></p>
            <img class="detail-img" id="detail-img-a" src="" alt="" />
          </div>
          <div class="detail-panel">
            <div class="detail-label">POETIC</div>
            <p class="detail-text detail-text-poetic" id="detail-text-b"></p>
            <img class="detail-img" id="detail-img-b" src="" alt="" />
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── 랜딩 비디오 그리드 ────────────────────────────────────
      const COLS = 4;
      const ROWS = 4;
      const W = window.innerWidth;
      const H = window.innerHeight;
      const tileW = W / COLS;
      const tileH = H / ROWS;

      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

      const BASE_VIDEO = '7022026_Adult_Attractive_1280x720.mp4';
      const OTHER_VIDEOS = [
        '7185613_Chocolate_Hot_Chocolate_1280x720.mp4',
        '7188296_Plant_Meadowsweet_1280x720.mp4',
      ];
      const ALL_VIDEOS = [BASE_VIDEO, ...OTHER_VIDEOS];

      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const tile = document.createElement('div');
          tile.className = 'tile';

          ALL_VIDEOS.forEach((src, i) => {
            const vid = document.createElement('video');
            vid.src = src;
            vid.autoplay = true;
            vid.loop = true;
            vid.muted = true;
            vid.playsInline = true;
            vid.style.position = 'absolute';
            vid.style.width = '100vw';
            vid.style.height = '100vh';
            vid.style.left = -col * tileW + 'px';
            vid.style.top = -row * tileH + 'px';
            vid.style.objectFit = 'cover';
            vid.style.transition = 'opacity 0.8s ease';
            vid.style.opacity = i === 0 ? '0.3' : '0';
            tile.appendChild(vid);
          });

          grid.appendChild(tile);

          function scheduledSwitch() {
            const vids = tile.querySelectorAll('video');
            const otherIdx =
              1 + Math.floor(Math.random() * OTHER_VIDEOS.length);
            vids[0].style.opacity = '0';
            vids[otherIdx].style.opacity = '0.3';
            const hold = 1000 + Math.random() * 2000;
            setTimeout(() => {
              vids[otherIdx].style.opacity = '0';
              vids[0].style.opacity = '0.3';
              const next = 1500 + Math.random() * 3500;
              setTimeout(scheduledSwitch, next);
            }, hold);
          }
          setTimeout(scheduledSwitch, Math.random() * 5000);
        }
      }

      // ── Socket.IO 디스플레이 ──────────────────────────────────
      const socket = io({ query: { type: 'display' } });

      const screens = {
        idle: document.getElementById('screen-idle'),
        scanning: document.getElementById('screen-scanning'),
        reveal: document.getElementById('original-reveal'),
        result: document.getElementById('screen-result'),
        archive: document.getElementById('screen-archive'),
      };

      function showOnly(name) {
        Object.entries(screens).forEach(([k, el]) => {
          el.classList.toggle('hidden', k !== name);
        });
      }

      let revealTimer = null;
      let lastSpokenScanId = null;

      socket.on('state', (state) => {
        if (revealTimer) {
          clearTimeout(revealTimer);
          revealTimer = null;
        }

        if (state.mode === 'archive') {
          showOnly('archive');
          renderArchiveGrid(state.scans);
          document.getElementById('depth-indicator').classList.add('hidden');
          return;
        }

        if (state.mode === 'idle') {
          showOnly('idle');
          window._currentScans = state.scans;
          document.getElementById('depth-indicator').classList.add('hidden');
        } else if (state.mode === 'scanning') {
          if (state.currentScan?.originalDataUrl && state.depthLevel === 0) {
            document.getElementById('original-img').src =
              state.currentScan.originalDataUrl;
            showOnly('reveal');
            revealTimer = setTimeout(() => {
              showOnly('scanning');
              startScanAnim();
            }, 3000);
          } else {
            showOnly('scanning');
            startScanAnim();
          }
        } else if (state.mode === 'result') {
          const scan = state.currentScan;
          if (!scan) return;

          const chain = scan.depthChain;
          const current = chain[state.depthLevel] || chain[chain.length - 1];

          document.getElementById('text-a').textContent = current.textA;
          document.getElementById('text-b').textContent = current.textB;
          if (current.imageA)
            document.getElementById('img-a').src = current.imageA;
          if (current.imageB)
            document.getElementById('img-b').src = current.imageB;

          // 원본 이미지
          if (scan.originalDataUrl)
            document.getElementById('original-scan-img').src =
              scan.originalDataUrl;

          const resultEl = document.getElementById('screen-result');
          resultEl.className = '';
          if (state.viewMode === 'literal')
            resultEl.classList.add('view-literal');
          if (state.viewMode === 'poetic')
            resultEl.classList.add('view-poetic');

          const lossOpacity = state.lossLevel / 100;
          document.getElementById('loss-a').style.opacity = lossOpacity;
          document.getElementById('loss-b').style.opacity = lossOpacity;

          showOnly('result');
          stopScanAnim();
          window._currentScans = state.scans;

          if (scan.id !== lastSpokenScanId) {
            lastSpokenScanId = scan.id;
            speak(current.textA, current.textB);
          }
        }
      });

      // ── 스크린리더 ────────────────────────────────────────────
      const synth = window.speechSynthesis;
      let speechUnlocked = false;

      document.addEventListener('click', () => {
        if (!speechUnlocked) {
          const u = new SpeechSynthesisUtterance('');
          synth.speak(u);
          speechUnlocked = true;
        }
      });

      function speak(textA, textB) {
        synth.cancel();
        const uttA = new SpeechSynthesisUtterance(textA);
        uttA.lang = 'ko-KR';
        uttA.rate = 0.9;
        uttA.pitch = 0.8;
        const uttB = new SpeechSynthesisUtterance(textB);
        uttB.lang = 'ko-KR';
        uttB.rate = 0.75;
        uttB.pitch = 0.7;
        uttA.onend = () => setTimeout(() => synth.speak(uttB), 800);
        synth.speak(uttA);
      }

      // ── 스캔 애니메이션 ───────────────────────────────────────
      let stackInterval = null;
      let savedImageUrls = [];

      async function loadSavedImages() {
        try {
          const res = await fetch('/api/saved-images');
          savedImageUrls = await res.json();
        } catch (e) {
          savedImageUrls = [];
        }
      }
      loadSavedImages();

      function startScanAnim() {
        const scanning = document.getElementById('screen-scanning');
        const oldEl = document.getElementById('stack-container');
        if (oldEl) oldEl.remove();

        const cols = 6;
        const cellSize = Math.ceil(window.innerWidth / cols);
        const rows = Math.ceil(window.innerHeight / cellSize) + 1;
        const total = cols * rows;

        const container = document.createElement('div');
        container.id = 'stack-container';
        container.style.cssText = `position:absolute;top:0;left:0;width:${cols * cellSize}px;height:${rows * cellSize}px;display:grid;grid-template-columns:repeat(${cols},${cellSize}px);grid-template-rows:repeat(${rows},${cellSize}px);pointer-events:none`;
        scanning.appendChild(container);

        const newScans = (window._currentScans || [])
          .map((s) => s.originalDataUrl || s.imageA)
          .filter(Boolean);
        const shuffled = savedImageUrls.slice().sort(() => Math.random() - 0.5);
        const allImages = newScans.concat(shuffled);

        let idx = 0;
        function addNext() {
          if (idx >= total || allImages.length === 0) {
            clearInterval(stackInterval);
            stackInterval = null;
            return;
          }
          const img = document.createElement('img');
          img.src = allImages[idx % allImages.length];
          idx++;
          img.style.cssText = `width:${cellSize}px;height:${cellSize}px;object-fit:cover;display:block;transform:perspective(600px) rotateY(90deg);transition:transform 0.45s ease`;
          container.appendChild(img);
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              img.style.transform = 'perspective(600px) rotateY(0deg)';
            }),
          );
        }
        addNext();
        stackInterval = setInterval(addNext, 250);
      }

      function stopScanAnim() {
        if (stackInterval) {
          clearInterval(stackInterval);
          stackInterval = null;
        }
        const old = document.getElementById('stack-container');
        if (old) old.remove();
      }

      socket.on('textReady', () => {});

      // ── 아카이브 ──────────────────────────────────────────────
      function renderArchiveGrid(scans) {
        const grid = document.getElementById('archive-grid');
        const count = document.getElementById('archive-count');
        count.textContent = scans.length + '개';
        grid.innerHTML = '';
        document.getElementById('archive-detail').classList.add('hidden');
        scans.forEach((scan) => {
          const item = document.createElement('div');
          item.className = 'archive-grid-item';
          item.onclick = () => showDetail(scan);
          const img = document.createElement('img');
          img.src = scan.originalDataUrl || scan.imageA || '';
          img.alt = '';
          item.appendChild(img);
          grid.appendChild(item);
        });
      }

      function showDetail(scan) {
        const chain = scan.depthChain?.[0] || scan;
        document.getElementById('detail-original').src =
          scan.originalDataUrl || '';
        document.getElementById('detail-text-a').textContent =
          chain.textA || scan.textA || '';
        document.getElementById('detail-text-b').textContent =
          chain.textB || scan.textB || '';
        document.getElementById('detail-img-a').src =
          chain.imageA || scan.imageA || '';
        document.getElementById('detail-img-b').src =
          chain.imageB || scan.imageB || '';
        document.getElementById('archive-detail').classList.remove('hidden');
      }

      socket.on('selectArchive', (index) => {
        const grid = document.getElementById('archive-grid');
        const items = grid.querySelectorAll('.archive-grid-item');
        if (items[index]) items[index].click();
      });
    </script>
  </body>
</html>
